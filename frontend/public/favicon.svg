<!-- Знак AO Studio: буквы вырезаны насквозь, сквозь них виден фон. Фавиконка грузится без
     веб-шрифта, поэтому буквы набраны запасным Georgia и геометрия посчитана по его метрикам. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#34d399"/>
      <stop offset="1" stop-color="#059669"/>
    </linearGradient>
    <mask id="m">
      <rect width="48" height="48" rx="13" fill="#fff"/>
      <text x="23.905" y="31.906" text-anchor="middle" font-family="Georgia,'Times New Roman',serif"
            font-weight="bold" font-size="23" fill="#000">AO</text>
    </mask>
  </defs>
  <rect width="48" height="48" rx="13" fill="url(#g)" mask="url(#m)"/>
</svg>
